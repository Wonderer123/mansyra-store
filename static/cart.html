<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/images/mansyra3.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mansyra - Your Cart</title>

    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/theme.css">

</head>

<body class="inner cart">

<header class="site-header">
    <a href="/goof.html" class="logo"><span class="logo-mark">Mansyra</span><span class="logo-sub">Beauty</span></a>
    <nav>
        <a href="/goof.html#shop">Shop</a>
        <a href="/cart.html">Cart</a>
        <a href="/orders.html">Orders</a>
        <a href="/help_and_support.html">Help</a>
    </nav>
</header>

<div class="cart-page">

    <h1 class="cart-title">
        🛍️ Your Shopping Cart
    </h1>

    <div id="cart-container" class="cart-container-box"></div>

    <div class="cart-actions">

        <button id="clear-cart-btn">Clear Cart</button>

        <button id="continue-shopping-btn">Continue Shopping</button>

    </div>

    <div id="cart-summary" class="cart-summary" style="display:none;">

        <h3>Order Summary</h3>

        <p>Subtotal : ₹<span id="subtotal">0</span></p>

        <p>GST (18%) : ₹<span id="tax">0</span></p>

        <p>Delivery : ₹<span id="delivery">0</span></p>

        <hr>

        <h2>Total : ₹<span id="total">0</span></h2>

        <button id="order-now-btn" class="order-btn">
            Order Now
        </button>

    </div>

</div>

<script>

    document.getElementById("continue-shopping-btn").onclick=function(){

    window.location.href="/goof.html";

    }

</script>

<script src="/js/cart.js"></script>
<script>
    window.addEventListener("pageshow", function(event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
</script>
</body>

</html>
